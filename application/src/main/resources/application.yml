# -------------------------------------------------------------------------------------------------------
# Custom properties (not part of Spring)
# These property names (and values, of course) can be changed to your liking.
# -------------------------------------------------------------------------------------------------------
application:
  default-page-limit: 25

# -------------------------------------------------------------------------------------------------------
# Spring properties
# -------------------------------------------------------------------------------------------------------
server:
  port: 8080
  servlet:
    context-path: /

# -------------------------------------------------------------------------
# OpenApi/SpringDoc/Swagger properties
# -------------------------------------------------------------------------
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  model-converters:
    pageable-converter:
      enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha

# -------------------------------------------------------------------------
# Actuator properties
# -------------------------------------------------------------------------
management:
  endpoint:
    health:
      probes:
        enabled: true

# -------------------------------------------------------------------------
# Spring properties
# -------------------------------------------------------------------------

spring:
  application:
    name: kafka-zen-lab-102-consumer-api

  # Modify these as desired.
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    serialization:
      indent_output: false
    deserialization:
      fail_on_unknown_properties: false

  jpa:
    show-sql: true
    properties:
      hibernate:
        id:
          new_generator_mappings: false

  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:kafka-zen-lab-102-consumer-api;DATABASE_TO_UPPER=false
    # -------------------------------------------------------------------------------------------
    # Hikari connection pool properties. See: https://github.com/brettwooldridge/HikariCP
    # -------------------------------------------------------------------------------------------
    hikari:
      connection-timeout: "2000"
      maximum-pool-size: 20
      minimum-idle: 2
      pool-name: "springboot-hikari-cp"
      max-lifetime: 1000000
      data-source-properties:
        cachePrepStmts: true
        # Size of the prepared statement cache
        prepStmtCacheSize: 250
        # Maximum length of a statement the driver will cache
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchStatements: true
        cacheResultsSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false


  # -------------------------------------------------------------------------------------------
  # Kafka
  # -------------------------------------------------------------------------------------------
  kafka:
    bootstrap-servers: "localhost:9092"
    consumer:
      auto-commit-interval: "1s"
      bootstrap-servers: "${spring.kafka.bootstrap-servers}"
      client-id: "default-client-id"
      enable-auto-commit: true
      group-id: "${spring.application.name}"
      key-deserializer: "org.apache.kafka.common.serialization.StringDeserializer"
      value-deserializer: "org.apache.kafka.common.serialization.StringDeserializer"
    producer:
      bootstrap-servers: "${spring.kafka.bootstrap-servers}"
      key-serializer: "org.apache.kafka.common.serialization.StringSerializer"
      value-serializer: "org.apache.kafka.common.serialization.StringSerializer"
      properties:
        acks: "all"
        retries: 10
        retry.backoff.ms: "1000"
    listener:
      ack-count: 3
      client-id: "${spring.application.name}"
      concurrency: 2
      missing-topics-fatal: false
    #
    # Kafka Streams. Remove this stanza if it doesn't apply to your project.
    #
    streams:
      application-id: "${spring.application.name}"
      # This is optional if `spring.kafka.bootstrap-servers` is configured.
      bootstrap-servers: ${spring.kafka.bootstrap-servers}
      properties:
        default:
          key:
            serde: 'org.apache.kafka.common.serialization.Serdes$StringSerde'
          value:
            serde: 'org.apache.kafka.common.serialization.Serdes$StringSerde'
          deserialization:
            exception:
              handler: 'org.apache.kafka.streams.errors.LogAndContinueExceptionHandler'
          serialization:
            exception:
              handler: 'org.apache.kafka.streams.errors.LogAndContinueExceptionHandler'


# -------------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------------
logging:
  level:
    root: INFO
