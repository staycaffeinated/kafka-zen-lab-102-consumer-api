spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:kafka-zen-lab-102-consumer-api;DATABASE_TO_UPPER=false
    username: root
    password: secret

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
