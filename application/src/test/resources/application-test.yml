spring:
    config:
        activate:
            on-profile: test

 
    datasource:
        driver-class-name: "org.h2.Driver"
        url: "jdbc:h2:mem:testdb;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1"
        username: "sa"
        password: "password"

    jpa:
        database-platform: "org.hibernate.dialect.H2Dialect"
        generate-ddl: true

    sql:
        init:
            mode: "embedded"
h2:
    console:
    enabled: true
    path: "/h2-console"
    settings:
        trace: false
        web-allow-others: false
