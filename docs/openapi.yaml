# OpenAPI 3.0 specification for kafka-zen-lab-102-consumer-api
#
# This file is a hand-maintained companion to the SpringDoc-generated specification
# available at runtime via GET /api-docs (JSON) and the Swagger UI at
# /swagger-ui/index.html. Keep this file in sync when REST endpoints change.
#
# Generated/reviewed: 2026-07-27

openapi: "3.0.3"

info:
  title: kafka-zen-lab-102-consumer-api
  description: |
    Spring Boot Kafka consumer that ingests click-stream events produced by
    `kafka-zen-lab-101-traffic-simulator`, maps them to domain events, and stores them.

    The REST surface of this service is intentionally minimal. The primary interface
    is the Kafka topic `kafka-zen.lab-101.traffic-simulator.click-event.received`.
    The single REST endpoint (`GET /`) acts as a liveness check for load-balancer and
    container-orchestration probes.

    All error responses conform to [RFC 7807](https://www.rfc-editor.org/rfc/rfc7807)
    (Problem Details for HTTP APIs) and use the `application/problem+json` media type.
  version: "0.0.1"
  contact:
    name: kafka-zen-lab
  license:
    name: See repository

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: root
    description: Liveness check
  - name: actuator
    description: Spring Boot Actuator management endpoints

paths:

  /:
    get:
      tags:
        - root
      summary: Liveness check
      description: |
        Returns HTTP 200 with an empty body. Confirms the Spring Web context is
        running and accepting requests.

        For Kubernetes liveness and readiness probes, prefer the dedicated Actuator
        endpoints at `/actuator/health/liveness` and `/actuator/health/readiness`.
      operationId: getHome
      responses:
        "200":
          description: Application is running
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Internal server error"
                status: 500
                detail: "An unexpected error occurred"

  /actuator/health:
    get:
      tags:
        - actuator
      summary: Aggregate health check
      description: |
        Returns the overall health status of the application. Controlled by Spring Boot
        Actuator's health contributors.
      operationId: health
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
        "503":
          description: Application is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: DOWN

  /actuator/health/liveness:
    get:
      tags:
        - actuator
      summary: Liveness probe
      description: |
        Reports whether the application process is alive. Returns `UP` when the
        Spring application context has started successfully.
        Intended for use as a Kubernetes `livenessProbe` HTTP GET target.
      operationId: healthLiveness
      responses:
        "200":
          description: Application is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
        "503":
          description: Application is not alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /actuator/health/readiness:
    get:
      tags:
        - actuator
      summary: Readiness probe
      description: |
        Reports whether the application is ready to accept traffic. Returns `UP` when
        all required infrastructure (Kafka, etc.) is reachable.
        Intended for use as a Kubernetes `readinessProbe` HTTP GET target.
      operationId: healthReadiness
      responses:
        "200":
          description: Application is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
        "503":
          description: Application is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /swagger-ui/index.html:
    get:
      tags:
        - actuator
      summary: Swagger UI
      description: |
        Interactive API documentation generated by SpringDoc. Available only when the
        application is running. Not a stable API surface — do not depend on this path
        in automated clients.
      operationId: swaggerUi
      responses:
        "200":
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

  /api-docs:
    get:
      tags:
        - actuator
      summary: OpenAPI JSON document
      description: |
        Machine-readable OpenAPI 3.0 specification generated at runtime by SpringDoc.
        This endpoint reflects the live state of all registered Spring MVC endpoints
        and is more authoritative than the static `docs/openapi.yaml` file.
      operationId: apiDocs
      responses:
        "200":
          description: OpenAPI 3.0 JSON document
          content:
            application/json:
              schema:
                type: object

components:
  schemas:

    ProblemDetail:
      description: |
        RFC 7807 Problem Details object. Returned by `GlobalExceptionHandler` for all
        error responses. The `Content-Type` of error responses is `application/problem+json`.
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            URI reference that identifies the problem type. Defaults to `about:blank`
            when no specific type URI is defined.
          example: "about:blank"
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: "The requested resource was not found"
        status:
          type: integer
          description: HTTP status code.
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence of the problem.
          example: "Event evt-001 does not exist"
        instance:
          type: string
          format: uri
          description: URI reference that identifies the specific occurrence of the problem.
        errors:
          type: array
          description: |
            Present only on HTTP 400 responses caused by Bean Validation failures.
            Each element describes one constraint violation.
          items:
            $ref: "#/components/schemas/ConstraintViolation"

    ConstraintViolation:
      description: Single Bean Validation constraint violation. Appears in the `errors`
        array of a 400 Problem Detail response.
      type: object
      properties:
        reason:
          type: string
          description: Constraint violation message.
          example: "{ResourceId.invalid}"
        invalid value:
          type: string
          description: The value that failed validation (omitted when null).
          example: "not-an-id"
        method:
          type: string
          description: The property or method path that failed validation.
          example: "getById.id"

    HealthResponse:
      description: Spring Boot Actuator health response (simplified).
      type: object
      properties:
        status:
          type: string
          description: Aggregate health status.
          enum:
            - UP
            - DOWN
            - OUT_OF_SERVICE
            - UNKNOWN
          example: UP
        components:
          type: object
          description: Health details per contributor (present when `show-details` is enabled).
          additionalProperties:
            type: object
